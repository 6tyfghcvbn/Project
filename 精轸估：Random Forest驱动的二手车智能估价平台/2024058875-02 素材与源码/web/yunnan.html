<script>
    document.addEventListener('DOMContentLoaded', function () {
        const provinceLink = document.getElementById('province-link');
        const provinceDropdown = document.getElementById('province-dropdown');

        // 省份链接 mouseover 事件处理程序
        const showProvinceDropdown = function () {
            provinceDropdown.classList.remove('hidden');
        };

        // 省份链接 mouseout 事件处理程序
        const hideProvinceDropdownFromLink = function (event) {
            if (!provinceDropdown.contains(event.relatedTarget)) {
                hideProvinceDropdown();
            }
        };

        // 省份列表 mouseout 事件处理程序
        const checkMouseLeaveProvinceDropdown = function (event) {
            const rect = provinceDropdown.getBoundingClientRect();
            const isOutsideDropdown = (
                event.clientX < rect.left ||
                event.clientX > rect.right ||
                event.clientY < rect.top ||
                event.clientY > rect.bottom
            );

            if (isOutsideDropdown && !provinceLink.contains(event.relatedTarget)) {
                hideProvinceDropdown();
            }
        };

        // 隐藏省份列表的通用函数
        const hideProvinceDropdown = function () {
            provinceDropdown.classList.add('hidden');
        };

        // 添加事件监听器
        provinceLink.addEventListener('mouseover', showProvinceDropdown);
        provinceLink.addEventListener('mouseout', hideProvinceDropdownFromLink);
        provinceDropdown.addEventListener('mouseout', checkMouseLeaveProvinceDropdown);
    });
</script>
